name = "chitchat"

[services.web]
command = "/app/gateway"
port = 8080

[services.web.concurrency]
mode = "fixed"
num_instances = 1

[services.nats]
command = "/run-nats.sh"

[services.nats.concurrency]
mode = "fixed"
num_instances = 1

[[services.nats.disks]]
name = "data"
provider = "local"
mount_path = "/miren/data/local"

[[env]]
key = "NATS_URL"
value = "nats://nats.app.miren:4222"

[[env]]
key = "GATEWAY_API_KEY"
required = true
sensitive = true

[[env]]
key = "MULTIPASS_BASE_URL"
description = "Optional. Set to enable multipass JWT auth (e.g. https://multipass.miren.cloud)"

[[env]]
key = "ALLOWED_DOMAIN"
description = "Optional. Restrict multipass JWTs whose identity is an email to this domain (e.g. miren.dev)"

[[env]]
key = "ALLOWED_PREFIXES"
description = "Optional, comma-separated. Admit non-email service identities whose email/subject starts with one of these prefixes (e.g. org:org-Miren-P20syIg0MAcS:). A token passes if it matches ALLOWED_DOMAIN OR a prefix."

[[env]]
key = "DISCOVERY_MAX_AGE_SECONDS"
description = "Optional. Seconds a service descriptor is retained in the DISCOVERY stream before aging out (default 120). Must exceed services' heartbeat interval and ttl_seconds. See docs/SERVICE_DISCOVERY.md"

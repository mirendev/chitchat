listen: 0.0.0.0:4222
server_name: chitchat

http_port: 8222

jetstream {
    store_dir: /miren/data/local/jetstream
    max_mem: 256MB
    max_file: 10GB
}

logtime: true
debug: false
trace: false

# Only the chitchat gateway talks to NATS. The gateway is what proves caller
# identity, so a client that reached NATS directly could forge the cc-* headers
# services trust. Requires NATS_TOKEN (see run-nats.sh).
#
# nats-server re-parses the value as config, so keep it to letters, digits and
# underscores, starting with a letter. Base64 can break it: a // starts a comment.
authorization {
    token: $NATS_TOKEN
}

max_payload: 8MB
max_connections: 1024
